<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        justify-content: center;
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 4rem;
      }

      @media (min-width: 900px) {
        form {
          width: 30%;
        }
      }

      @media (max-width: 900px) {
        form {
          width: 80%;
        }
      }
    </style>
  </head>
  <body>
    <h1>Reset your password for Dewi World</h1>
    <div id="loading-progress" class="spinner-border" role="status" style="display: none">
      <span class="visually-hidden">Loading...</span>
    </div>
    <form id="password-form">
      <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label">New Password</label>
        <input
          class="form-control"
          required
          name="password"
          type="password"
          placeholder="Enter new password (min 6 characters)"
        />
      </div>
      <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label">Confirm Password</label>
        <input
          class="form-control"
          required
          name="confirm-password"
          type="password"
          placeholder="Confirm new password"
        />
      </div>
      <button class="btn btn-primary" type="submit">Reset password</button>
    </form>
    <p style="display: none" id="success-message" class="btn btn-success">
      Password reset successfully!
    </p>
    <p style="display: none" id="error-message" class="btn btn-danger"></p>
    <script>
      const hash = window.location.hash;
      const query = hash.replace('#', '?');
      const params = Object.fromEntries(new URLSearchParams(query).entries());

      if (params?.error_code === 'otp_expired') {
        document.body.innerHTML = 'This link has expired. Please request a new one.';
      } else if (!!params?.error) {
        document.body.innerHTML = 'An error has ocurred while handling this request.';
      } else if (!params?.access_token) {
        document.body.innerHTML = 'Access denied.';
      }

      const success_message = document.getElementById('success-message');
      const error_message = document.getElementById('error-message');
      const form = document.getElementById('password-form');
      const spinner = document.getElementById('loading-progress');

      form?.addEventListener('submit', async event => {
        try {
          event.preventDefault();

          spinner.style.display = 'block';
          form.style.display = 'none';
          error_message.style.display = 'none';

          const formData = Object.fromEntries(new FormData(event.currentTarget).entries());

          if (formData?.password !== formData?.['confirm-password']) {
            throw new Error("Passwords don't match");
          }

          const hash = window.location.hash;
          const query = hash.replace('#', '?');
          const params = Object.fromEntries(new URLSearchParams(query).entries());

          const access_token = params?.access_token;
          const password = formData?.password;

          const response = await fetch('/api/v1/user/resetPassword', {
            method: 'PUT',
            body: JSON.stringify({
              access_token,
              password,
            }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.message);
          }

          spinner.style.display = 'none';
          success_message.style.display = 'block';
        } catch (error) { 
          error_message.style.display = 'block';
          error_message.innerText = error.message;
          spinner.style.display = 'none';
          form.style.display = 'block';
        }
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
